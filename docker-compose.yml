services:
  fred-lang:
    build:
      context: .
      args:
        WITH_GAZEBO: "false"
    image: fred-lang-jazzy
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    stdin_open: true
    tty: true
